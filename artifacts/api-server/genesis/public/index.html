<!doctype html>
<html lang="en" data-genesis-build="GENESIS_PLATINUM_3D_V2_2" data-curve-state="sync" data-live-state="retry">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="description" content="GENESIS — compact 3D ring dashboard." />
  <title>GENESIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="ambient-grid"></div>
    <div class="ambient-vignette"></div>
    <div class="ambient-orbs"></div>
  </div>

  <main class="platinum-shell">
    <section class="scene" id="scene" aria-label="GENESIS live token dashboard">
      <div class="scene-noise"></div>

      <div class="metric metric-price">
        <span>PRICE</span>
        <strong id="priceValue">—</strong>
      </div>

      <div class="metric metric-mcap">
        <span>MARKET CAP</span>
        <strong id="marketCapValue">—</strong>
      </div>

      <div class="metric metric-sol">
        <span>MC / SOL</span>
        <strong id="marketCapSolValue">—</strong>
      </div>

      <div class="metric metric-state">
        <span>STATE</span>
        <strong id="stateValue">—</strong>
      </div>

      <div class="chart-wrap" id="chartWrap">
        <div class="chart-pedestal"></div>
        <div class="ring ring-outer" id="ringCurve" style="--progress:0%;"></div>
        <div class="ring ring-middle" id="ringMarket" style="--progress:0%;"></div>
        <div class="ring ring-inner" id="ringSol" style="--progress:0%;"></div>
        <div class="ring ring-coreline" id="ringBurn" style="--progress:0%;"></div>
        <div class="center-core">
          <div class="center-core-face">
            <span id="coreSymbol" class="core-symbol">$GENESIS</span>
            <strong id="coreProgress" class="core-progress">—</strong>
            <span id="coreState" class="core-state">SYNCING</span>
          </div>
        </div>
      </div>
    </section>

    <section class="data-rail">
      <div class="data-cell">
        <span>SUPPLY</span>
        <strong id="supplyValue">—</strong>
      </div>
      <div class="data-cell">
        <span>REDUCED</span>
        <strong id="supplyReducedValue">—</strong>
      </div>
      <div class="data-cell mint-cell">
        <span>MINT</span>
        <button id="copyButton" type="button" class="mint-button" aria-label="Copy mint address">
          <span id="copyText" class="mint-text">NOT SET</span>
          <svg class="copy-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M9 9h9v9H9z"></path>
            <path d="M6 6h9v2H8v7H6z"></path>
          </svg>
        </button>
      </div>
    </section>

    <section class="mechanism-strip" aria-label="Protocol mechanism">
      <span>TRADE</span>
      <i>→</i>
      <span>FEES</span>
      <i>→</i>
      <span>BUYBACK</span>
      <i>→</i>
      <span>BURN</span>
    </section>
  </main>

  <div id="toast" class="toast">MINT COPIED</div>

  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
