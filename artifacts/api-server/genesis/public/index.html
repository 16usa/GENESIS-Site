<!doctype html>
<html lang="en" data-genesis-build="GENESIS_PLATINUM_3D_V2_0">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="description" content="GENESIS — platinum 3D live token engine." />
  <title>GENESIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="ambient-grid"></div>
    <div class="ambient-halo"></div>
    <div class="ambient-noise"></div>
  </div>

  <main class="platinum-shell">
    <header class="top-strip">
      <div class="brand">
        <span class="brand-name">GENESIS</span>
        <span class="brand-divider"></span>
        <span id="tickerValue" class="token-symbol">$GENESIS</span>
      </div>

      <div id="engineStatus" class="live-status">
        <i></i>
        <span>LIVE</span>
      </div>
    </header>

    <section class="engine-zone" aria-label="GENESIS live token engine">
      <div class="scene" id="scene">
        <div class="floor-shadow" aria-hidden="true"></div>

        <div class="ring-system" id="ringSystem" aria-hidden="true">
          <div class="halo halo-outer"></div>
          <div class="halo halo-inner"></div>

          <div class="ring ring-outer">
            <div class="ring-metal"></div>
            <div class="ring-specular"></div>
          </div>

          <div class="ring ring-market">
            <div class="ring-metal"></div>
            <div class="ring-specular"></div>
          </div>

          <div class="ring ring-progress">
            <div class="progress-track"></div>
            <div id="progressArc" class="progress-arc"></div>
            <div class="ring-specular"></div>
          </div>

          <div class="ring ring-inner">
            <div class="ring-metal"></div>
          </div>
        </div>

        <div class="core" id="core">
          <div class="core-edge"></div>
          <div class="core-face">
            <span id="coreSymbol" class="core-symbol">$GENESIS</span>
            <strong id="coreProgress" class="core-progress">—</strong>
            <span id="coreState" class="core-state">SYNCING</span>
          </div>
          <div class="core-reflection"></div>
        </div>

        <div class="metric metric-price">
          <span>PRICE</span>
          <strong id="priceValue">—</strong>
        </div>

        <div class="metric metric-mcap">
          <span>MARKET CAP</span>
          <strong id="marketCapValue">—</strong>
        </div>

        <div class="metric metric-sol">
          <span>MC / SOL</span>
          <strong id="marketCapSolValue">—</strong>
        </div>

        <div class="metric metric-state">
          <span>STATE</span>
          <strong id="stateValue">—</strong>
        </div>

        <div class="orbit-caption orbit-caption-left">
          <span id="sourceValue">PUMP.FUN</span>
        </div>
        <div class="orbit-caption orbit-caption-right">
          <span id="updatedValue">SYNC</span>
        </div>
      </div>
    </section>

    <section class="data-rail">
      <div class="data-cell">
        <span>SUPPLY</span>
        <strong id="supplyValue">—</strong>
      </div>
      <div class="data-cell">
        <span>REDUCED</span>
        <strong id="supplyReducedValue">—</strong>
      </div>
      <div class="data-cell mint-cell">
        <span>MINT</span>
        <button id="copyButton" type="button" class="mint-button">NOT SET</button>
      </div>
    </section>

    <section class="mechanism-strip" aria-label="Protocol mechanism">
      <span>TRADE</span>
      <i>→</i>
      <span>FEES</span>
      <i>→</i>
      <span>BUYBACK</span>
      <i>→</i>
      <span>BURN</span>
    </section>

    <section class="actions">
      <a id="pumpButton" class="action action-primary disabled" href="#" aria-disabled="true">PUMP.FUN</a>
      <a id="explorerLink" class="action action-secondary disabled" href="#" aria-disabled="true">SOLSCAN</a>
    </section>
  </main>

  <div id="toast" class="toast">COPIED</div>

  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
